#################################
#       General Settings        #
#################################

vsync = true;
fading = true;
fade-delta = 4;
fade-in-step = 0.03;
fade-out-step = 0.03;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

#################################
#         Transparency          #
#################################

inactive-opacity = 0.85;
active-opacity = 1.0;
opacity-rule = [
  "100:class_g = 'rofi'",
  "100:class_g = 'Dunst'",
  "100:class_g = 'Polybar'"
];

#################################
#           Shadows             #
#################################

shadow = true;
shadow-radius = 10;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-opacity = 0.8;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g = 'Rofi'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

#################################
#             Blur              #
#################################

blur-method = "dual_kawase";
blur-strength = 8;
blur-background = true;
blur-background-frame = true;
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

#################################
#         Rounded Corners       #
#################################
corner-radius = 12;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];